# fly.toml — Fly.io deployment config for octo server
# Deploy with: fly deploy
app            = "octo"
primary_region = "sin"   # Singapore — closest to India

[build]
  builder = "paketobuildpacks/builder:base"

[http_service]
  internal_port = 7681
  force_https   = true

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1