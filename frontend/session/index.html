<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>octo — terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <link rel="stylesheet" href="/session/style.css" />
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <a href="/" class="brand-link" aria-label="Return to home">
        <span>&larr;</span> octo
      </a>
      <div class="divider"></div>
      <div class="session-info">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
    <div class="topbar-right">
      <button id="copy-btn" class="action-btn" onclick="copySessionLink()">
        Copy Link
      </button>
    </div>
  </div>

  <div id="terminal-wrapper">
    <div id="terminal"></div>
  </div>

  <script>
    window.OCTO_SESSION = {
      sessionId: "{{.SessionID}}",
      token: "{{.Token}}"
    };
  </script>
  <script src="/session/terminal.js" defer></script>
</body>
</html>
