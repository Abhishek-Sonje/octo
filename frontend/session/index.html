<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>octo — terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d1117; }
    #terminal { height: 100%; padding: 4px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'JetBrains Mono, Menlo, Monaco, monospace',
      theme: { background: '#0d1117', foreground: '#e6edf3' }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    requestAnimationFrame(() => fitAddon.fit());

    // ── Figure out which WebSocket endpoint to use ──────────────────────────
    //
    // Two modes this page can be served in:
    //
    //   LOCAL mode  — served by `octo` CLI at localhost:7681
    //                 path is always "/"
    //                 WS connects to:  ws://localhost:7681/ws?token=<token>
    //
    //   TUNNEL mode — served by `octo server` at octo.sh/s/:id
    //                 path is "/s/:id"
    //                 WS connects to:  wss://octo.sh/s/:id  (same path, WS upgrade)
    //
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const path  = location.pathname;

    let wsURL;
    if (path.startsWith('/s/')) {
      // TUNNEL mode — connect WS to the same /s/:id path
      // ProxyHandler on the server handles the WS upgrade here
      wsURL = `${proto}://${location.host}${path}`;
    } else {
      // LOCAL mode — connect WS to /ws with token
      const token = new URLSearchParams(location.search).get('token') || '';
      wsURL = `${proto}://${location.host}/ws?token=${token}`;
    }

    const ws = new WebSocket(wsURL);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      // Send initial terminal size so the PTY knows its dimensions
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };

    ws.onmessage = (event) => {
      term.write(new Uint8Array(event.data));
    };

    ws.onclose = () => term.writeln('\r\n\x1b[31m[session closed]\x1b[0m');
    ws.onerror = () => term.writeln('\r\n\x1b[31m[connection error]\x1b[0m');

    term.onData((data) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(new TextEncoder().encode(data));
      }
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    });
  </script>
</body>
</html>
