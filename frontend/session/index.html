<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>octo — terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d1117; }
    #terminal { height: 100%; padding: 4px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'JetBrains Mono, Menlo, Monaco, monospace',
      theme: {
        background: '#0d1117',
        foreground: '#e6edf3',
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));

    // MUST call fit AFTER open AND after a layout tick
    requestAnimationFrame(() => fitAddon.fit());

    // Token is passed in the URL by the CLI: ?token=abc123
    const token = new URLSearchParams(location.search).get('token') || '';
    const proto  = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws     = new WebSocket(`${proto}://${location.host}/ws?token=${token}`);
    ws.binaryType = 'arraybuffer'; // CRITICAL — never omit this

    ws.onopen = () => {
      // Send initial size immediately so PTY knows the terminal dimensions
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };

    ws.onmessage = (event) => {
      term.write(new Uint8Array(event.data)); // CRITICAL — always Uint8Array, never string
    };

    ws.onclose = () => term.writeln('\r\n\x1b[31m[session closed]\x1b[0m');
    ws.onerror = () => term.writeln('\r\n\x1b[31m[connection error]\x1b[0m');

    term.onData((data) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(new TextEncoder().encode(data)) // raw binary — gorilla receives as BinaryMessage
      }
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    });
  </script>
</body>
</html>
