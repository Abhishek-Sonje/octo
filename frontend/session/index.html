<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>octo — terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <style>
    :root {
      /* Premium Dark Theme (Anthropic inspired) */
      --bg-main: #191816;
      --bg-panel: #22201d;
      --text-primary: #fbfaf7;
      --text-secondary: #9c9a96;
      --accent: #d97706;
      --border: #33302b;
      
      --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    html, body { 
      height: 100%; 
      background: var(--bg-main); 
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top App Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .brand-link:hover {
      opacity: 0.8;
    }

    .brand-link span {
      color: var(--accent);
    }

    .divider {
      width: 1px;
      height: 16px;
      background: var(--border);
    }

    .session-info {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffbd2e; /* Connecting (Yellow) */
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.connected { 
      background: #27c93f; /* Green */
      box-shadow: 0 0 8px rgba(39, 201, 63, 0.4);
    }
    
    .status-dot.disconnected { 
      background: #ff5f56; /* Red */
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border-color: #4a4740;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    /* Terminal Container */
    #terminal-wrapper { 
      flex: 1; 
      padding: 16px 20px; 
      overflow: hidden;
      position: relative;
    }

    #terminal { 
      width: 100%; 
      height: 100%; 
    }

    /* xterm.js Overrides to match theme seamlessly */
    .xterm .xterm-viewport {
      background-color: transparent !important;
    }
    
    .xterm-screen {
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <a href="/" class="brand-link" aria-label="Return to home">
        <span>&larr;</span> octo
      </a>
      <div class="divider"></div>
      <div class="session-info">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
    <div class="topbar-right">
      <button id="copy-btn" class="action-btn" onclick="copySessionLink()">
        Copy Link
      </button>
    </div>
  </div>

  <div id="terminal-wrapper">
    <div id="terminal"></div>
  </div>

  <script>
    // Premium Theme Config
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'JetBrains Mono, Menlo, Monaco, monospace',
      theme: { 
        background: '#191816', 
        foreground: '#fbfaf7',
        cursor: '#d97706',
        cursorAccent: '#191816',
        selectionBackground: 'rgba(217, 119, 6, 0.3)'
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    requestAnimationFrame(() => fitAddon.fit());

    // Status UI Elements
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // Link Copier
    function copySessionLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.getElementById('copy-btn');
        const originalText = btn.innerText;
        btn.innerText = 'Copied';
        btn.style.borderColor = 'var(--accent)';
        btn.style.color = 'var(--accent)';
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.borderColor = '';
          btn.style.color = '';
        }, 2000);
      });
    }

    // ── WebSocket Endpoint Logic ──────────────────────────
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const path  = location.pathname;

    let wsURL;
    if (path.startsWith('/s/')) {
      wsURL = `${proto}://${location.host}${path}`;
      document.title = `octo — ${path.split('/').pop()}`; // Update title with session id
    } else {
      const token = new URLSearchParams(location.search).get('token') || '';
      wsURL = `${proto}://${location.host}/ws?token=${token}`;
      document.title = `octo — local`;
    }

    const ws = new WebSocket(wsURL);
    ws.binaryType = 'arraybuffer'; // CRITICAL: Required for xterm

    ws.onopen = () => {
      statusDot.className = 'status-dot connected';
      statusText.innerText = 'Connected';
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };

    ws.onmessage = (event) => {
      term.write(new Uint8Array(event.data));
    };

    ws.onclose = () => {
      statusDot.className = 'status-dot disconnected';
      statusText.innerText = 'Session Closed';
      term.writeln('\r\n\x1b[38;5;208m[octo] Session disconnected cleanly.\x1b[0m');
    };

    ws.onerror = () => {
      statusDot.className = 'status-dot disconnected';
      statusText.innerText = 'Connection Error';
      term.writeln('\r\n\x1b[31m[octo] Connection error occurred.\x1b[0m');
    };

    term.onData((data) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(new TextEncoder().encode(data)); // Send as binary (Uint8Array)
      }
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    });
  </script>
</body>
</html>
