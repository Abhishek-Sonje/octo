<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>octo — session not found</title>
  <style>
    :root {
      /* Claude Aesthetic Theme Tokens: Warm Light Editorial */
      --canvas: #fbfaf7;
      --surface: #f1efe9;
      --surface-card: #ffffff;
      --border: #e6e4dc;
      
      --text-primary: #191816;
      --text-secondary: #65635f;
      --accent: #d97706;
      --accent-dim: rgba(217, 119, 6, 0.08);

      --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --radius: 8px;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body { 
      background-color: var(--canvas);
      /* Light Grid Pattern Background */
      background-image: 
        linear-gradient(rgba(230, 228, 220, 0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230, 228, 220, 0.5) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--text-primary); 
      font-family: var(--font-sans); 
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .error-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      box-shadow: 0 16px 48px rgba(25, 24, 22, 0.04);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .back-btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      background: var(--text-primary);
      color: var(--canvas);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 150ms ease-out, transform 150ms ease-out;
    }

    .back-btn:hover {
      background: #2b2926;
    }

    .back-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="icon-wrapper">🐙</div>
    <h1>Session Not Found</h1>
    <p>The coordinate code you specified could not be matched with an active outbound terminal stream. The session might have ended or expired.</p>
    <a href="/" class="back-btn">Return to Overview</a>
  </div>

</body>
</html>
